{% extends "base.html" %}

{% block title %}
<title>Создание предмета</title>
{% endblock %}

{% load crispy_forms_tags %}

{% block content %}
<form method="post">
  {% csrf_token %}
  {{ form | crispy }}
  <button class="btn btn-primary" type="submit">Добавить</button>
  <a class="btn btn-secondary" href="/profile/{{request.user.username}}/">Назад</a>
</form>
{% endblock %}
