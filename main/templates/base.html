<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    {% block title %}{% endblock %}
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
            crossorigin="anonymous"></script>

</head>
<body class="container">
<div class="container">
    <header class="d-flex flex-wrap align-items-center justify-content-between py-3 mb-4 border-bottom">
        <div class="col-md-3 mb-md-0"><a href="/" class="d-inline-flex link-body-emphasis text-decoration-none">
            {% load static %}
           <img src="{% static 'logo.png' %}" alt="" width="67" height="67">
        </a></div>
         <div class="col-md-3 text-end">
        {% if request.user.is_authenticated %}
        <a href="/profile/{{request.user.username}}" class="btn btn-outline-primary">
            {{request.user.username}}
        </a>
        {% else %}
        <a href="/login" class="btn btn-outline-primary me-2">Войти</a>
        <a href="/register" class="btn btn-primary">Зарегистрироваться</a>
        {% endif %}
    </div>
    </header>
</div>
{% block content %}{% endblock %}

<footer class="d-flex flex-wrap justify-content-between align-items-center py-3 my-4 border-top">
    <div class="col-md-4 d-flex align-items-center"><a href="/"
                                                       class="mb-3 me-2 mb-md-0 text-body-secondary text-decoration-none lh-1"
                                                       aria-label="Bootstrap">
    </a> <span class="mb-3 mb-md-0 text-body-secondary">© 2026 TeamDown, Inc</span></div>

</footer>
</body>
</html>
